# Push a tag like v0.2.0 to publish a release:
#   - a GitHub Release with notes-hq-<tag>.tar.gz (relay bundle + built app, no node_modules needed)
#   - a Docker image at ghcr.io/<owner>/notes-hq:<version> (and :latest for non-prerelease tags)
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Package
        run: |
          name="notes-hq-${GITHUB_REF_NAME}"
          mkdir "$name"
          cp apps/relay/dist/relay.js LICENSE "$name/"
          cp -r apps/web/dist "$name/web"
          tar -czf "$name.tar.gz" "$name"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Tags with a suffix (v0.2.0-rc.1) are marked as prereleases.
        run: gh release create "$GITHUB_REF_NAME" notes-hq-*.tar.gz --verify-tag --generate-notes $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

# Push a tag like v0.2.0 to publish a release:
#   - a GitHub Release with notes-hq-<tag>.tar.gz (relay bundle + built app, no node_modules needed)
#   - a Docker image at ghcr.io/<owner>/notes-hq:<version> (and :latest for non-prerelease tags)
# Third-party actions are pinned to commit SHAs (version in the comment) because this job can publish.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Package
        run: |
          name="notes-hq-${GITHUB_REF_NAME}"
          mkdir "$name"
          cp apps/relay/dist/relay.js LICENSE "$name/"
          cp -r apps/web/dist "$name/web"
          tar -czf "$name.tar.gz" "$name"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Tags with a suffix (v0.2.0-rc.1) are marked as prereleases.
        run: gh release create "$GITHUB_REF_NAME" notes-hq-*.tar.gz --verify-tag --generate-notes $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
